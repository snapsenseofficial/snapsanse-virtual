<title>SnapSense HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="logo.png" alt="SnapSense">
    <span class="brand-sub">HQ</span>
  </div>
  <nav class="nav" id="nav" aria-label="Bahagian"></nav>
  <div class="topbar-end">
    <span class="store-badge" id="store-badge" title="Di mana data disimpan"></span>
    <a class="btn ghost sm" href="https://claude.ai/artifact/LZMZiGWM3pVdcCy1ud1h9h" target="_blank" rel="noopener">Virtual Office ↗</a>
  </div>
</header>
<main id="main" class="main"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="core.js"></script>
<script src="overview.js"></script>
<script src="todo.js"></script>
<script src="content.js"></script>
<script src="copy.js"></script>
<script src="quote.js"></script>
<script src="settings.js"></script>
<script>
  HQ.ready.then(() => {
    const b = document.getElementById('store-badge');
    b.textContent = HQ.live ? '● Live' : '● Pratonton';
    b.title = HQ.live ? 'Data disimpan dalam dashboard ini' : 'Pratonton: data hanya disimpan dalam pelayar ini';
    b.dataset.live = HQ.live ? '1' : '0';
  });
  HQ.start();
</script>
